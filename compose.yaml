services:
  db:
    image: pgvector/pgvector:pg17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deskmate}
      POSTGRES_USER: ${POSTGRES_USER:-deskmate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - deskmate_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deskmate} -d ${POSTGRES_DB:-deskmate}"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  deskmate_postgres:
